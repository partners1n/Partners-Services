<!DOCTYPE html>
<html lang="th" class="antialiased">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#e0f2fe">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-title" content="FinanceNews">
  <meta name="application-name" content="FinanceNews">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <title id="page-title">ข่าวสารและตลาดการเงิน</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Liquid Glass Styles -->
  <link rel="stylesheet" href="search.css">
</head>
<body>

<div id="app">

  <!-- ── GLASS HEADER ── -->
  <header class="glass-header">
    <div class="header-inner">

      <!-- Logo slot: always fixed left, never s.crolls -->
      <div class="logo-slot" id="logo-slot">
        <button class="back-icon-btn" id="logo-btn" aria-label="หน้าหลัก">
          <img src="logo.png" alt="logo" draggable="false"/>
        </button>
      </div>

      <!-- Scrollable pill buttons -->
      <div class="scrollable-buttons" id="scroll-rail">
        <div class="inline-flex gap-2.5 items-center px-2 py-0.5 btn-scroll-area"
             id="btn-group"></div>
      </div>

    </div>
  </header>

  <!-- ── IFRAME LAYER ── -->
  <div class="iframe-container">
    <iframe
      id="mapFrame"
      width="100%"
      height="100%"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      src="about:blank">
    </iframe>
  </div>

</div>

<!-- Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(r => console.log('[SW] Registered:', r.scope))
        .catch(e => console.warn('[SW] Failed:', e));
    });
  }
</script>

<!-- App Logic -->
<script src="search.js"></script>

</body>
</html>
